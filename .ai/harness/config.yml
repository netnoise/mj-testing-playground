# The harness, in data. Prompts read this; humans edit it.
version: 0.1.0

doors:
  one_way:
    - dependency_change        # package.json, package-lock.json
    - migration
    - external_contract
    - test_deleted_or_weakened
    - auth_secrets_payments
    - outside_repo_or_shared_ref
    - gate_scope_config        # door 7
  # The door-7 path list has one owner: .claude/hooks/budget.mjs's GATE_SCOPE
  # array, which is also the sole enforcer. It emits .ai/harness/gate-scope.json
  # on every invocation - read that file if something else needs the list
  # (docs, this file's own removed gate_scope_paths key used to be a second
  # copy that drifted silently out of sync with the real one; a third and
  # fourth copy lived in HARNESS.md and the design docs. All now generated,
  # not hand-kept - see gate-scope.json's own "missing"/"observed_unlisted"
  # fields for what decay or drift would look like.)

gates:
  fast: lint (eslint)
  full: fast + jest --ci + hook-test.sh
  smoke: full + production build + generic route-mount check   # cheap runtime oracle, mid-loop
  deep: smoke + full e2e suite                                 # feature-driving spec, hand-back

budgets:
  default:
    # sized to the largest real run on record, not a round number:
    # ui-shell-redesign touched 30 files in ~90 minutes (decision 0005 -
    # already extended past a 45-minute default once). 12/45 was hit mid-run
    # by harness-v42-r2 with real, in-scope work still left.
    minutes: 90
    files: 30
  enforced_by: .claude/hooks/budget.mjs
  state: .ai/run/<slug>/state.json    # single writer: the hook

flows:
  fix:  [recall, understand, implement, test, record, retro?]
  tiny: [implement, verify]   # provably local: a typo, a one-line config value
                               # already covered by an existing test, a comment
                               # fix. Unsure whether it qualifies? It doesn't -
                               # run fix instead. See HARNESS.md's "Right-sizing
                               # the loop" for the failure mode this guards.

model_routing:
  # Route by "can this be wrong in a way nothing downstream catches",
  # not by whether it feels like typing.
  large: [understand, implement, test, record, digest, retro]
  # digest moved from small: its "One decision for you" block states a
  # default, a cost, and a reversibility judgment - synthesis across emits,
  # not concatenation of them, and a wrong cost-of-wrong is uncatchable by
  # construction (there is no downstream of the digest). retro is large for
  # the same reason: it has to notice its own mistakes accurately, which is
  # not a clerical task.
  small: [handoff, resume, recall, keep]
  overspend_on: understand                       # a bad brief is paid for by every step under it

journal:
  rule: "record a step if redoing it costs more than recording it, or if it changed the tree"
  skip: [read_only_exploration, steps_under_a_minute]
