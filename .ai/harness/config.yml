# The harness, in data. Prompts read this; humans edit it.
version: 0.1.0

doors:
  one_way:
    - dependency_change        # package.json, package-lock.json
    - migration
    - external_contract
    - test_deleted_or_weakened
    - auth_secrets_payments
    - outside_repo_or_shared_ref
    - gate_scope_config        # door 7 — see paths below
  # This list is documentation, not the enforcement source of truth:
  # .claude/hooks/budget.mjs hardcodes its own GATE_SCOPE array and does not
  # parse this file (no YAML dependency in the repo - adding one is door 1).
  # Keep the two in sync by hand; a decision record flags the duplication.
  gate_scope_paths:
    - jest.config.js
    - setup-jest.ts
    - playwright.config.ts
    - .eslintrc.json
    - angular.json
    - tsconfig*.json
    - .ai/harness/verify.sh
    - .claude/hooks/budget.mjs

gates:
  fast: lint (eslint)
  full: fast + jest --ci
  deep: full + production build + playwright e2e   # real runtime oracle

budgets:
  default:
    # sized to the largest real run on record, not a round number:
    # ui-shell-redesign touched 30 files in ~90 minutes (decision 0005 -
    # already extended past a 45-minute default once). 12/45 was hit mid-run
    # by harness-v42-r2 with real, in-scope work still left.
    minutes: 90
    files: 30
  enforced_by: .claude/hooks/budget.mjs
  state: .ai/run/<slug>/state.json    # single writer: the hook

flows:
  fix:  [recall, understand, implement, test, record]
  tiny: [implement, verify]

model_routing:
  # Route by "can this be wrong in a way nothing downstream catches",
  # not by whether it feels like typing.
  large: [understand, implement, test, record]   # record makes checkable claims
  small: [digest, handoff, resume, recall, keep]
  overspend_on: understand                       # a bad brief is paid for by every step under it

journal:
  rule: "record a step if redoing it costs more than recording it, or if it changed the tree"
  skip: [read_only_exploration, steps_under_a_minute]
